services:
  backend:
    build: ./backend
    container_name: regtech-backend
    environment:
      DATA_DIR: /data
      DB_PATH: /data/regtech.db
    ports:
      - "8000:8000"
    volumes:
      - .:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: regtech-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
